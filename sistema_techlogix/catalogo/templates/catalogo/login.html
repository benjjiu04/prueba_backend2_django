{% extends 'catalogo/base.html' %}

{% block title %}Iniciar Sesión - TechLogix S.A.{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white text-center py-3">
                <h4 class="mb-0"><i class="bi bi-lock-fill me-2"></i> Acceso Restringido</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    
                    {% if form.errors %}
                        <div class="alert alert-danger p-2 small mb-3">
                            Credenciales no válidas. Revisa tu usuario y contraseña.
                        </div>
                    {% endif %}

                    <div class="mb-3">
                        <label for="id_username" class="form-label fw-bold">Usuario</label>
                        <input type="text" name="username" class="form-control" id="id_username" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-bold">Contraseña</label>
                        <input type="password" name="password" class="form-control" id="id_password" required>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">Ingresar al Panel</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
